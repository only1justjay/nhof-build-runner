name: avy-win
# AVY Systems — Windows desktop installer.
#
# Runs here, on the PUBLIC nhof-build-runner repo, because public repos get unlimited
# free Actions minutes. The product source lives in a PRIVATE repo and is checked out
# with NHOF_PAT, the same pattern the plugin builds use.
#
# workflow_dispatch only — never on push. Standing instruction: don't run up the repo
# bill more than needed, and don't build on every commit.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag of only1justjay/avy-systems to build"
        required: false
        default: "master"
      publish:
        description: "Publish the installer as a release (yes/no)"
        required: false
        default: "no"
      version:
        description: "Release version tag suffix"
        required: false
        default: "1.0.0"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout AVY source (private, via token)
        uses: actions/checkout@v4
        with:
          repository: only1justjay/avy-systems
          ref: ${{ inputs.ref || 'master' }}
          token: ${{ secrets.NHOF_PAT }}
          path: avy

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            avy/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('avy/src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Versions must agree
        shell: bash
        working-directory: avy
        run: |
          TC=$(python -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          CG=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          WANT="${{ inputs.version || '1.0.0' }}"
          echo "tauri.conf=$TC  Cargo.toml=$CG  requested=$WANT"
          # A release tag that disagrees with the binary is a lie, and Windows may not
          # treat it as an upgrade over the previous install.
          if [ "$TC" != "$CG" ] || [ "$TC" != "$WANT" ]; then
            echo "::error::version mismatch - tag says $WANT but the app says $TC/$CG"
            exit 1
          fi
          echo "versions agree: $TC"

      - name: Build the desktop bundle
        shell: bash
        working-directory: avy
        run: |
          node build-desktop.mjs
          test -f dist-desktop/index.html || { echo "::error::dist-desktop/index.html missing"; exit 1; }
          echo "bundle bytes: $(wc -c < dist-desktop/index.html)"

      - name: Sanity-check the bundle before packaging
        shell: bash
        working-directory: avy
        run: |
          set -e
          H=dist-desktop/index.html
          # These are the things that silently break and still "build fine".
          grep -q 'licGate'            "$H" || { echo "::error::licence gate missing"; exit 1; }
          grep -q '__avyNeedsLicence'  "$H" || { echo "::error::gate bootstrap missing"; exit 1; }
          grep -q 'startApp'           "$H" || { echo "::error::startApp missing"; exit 1; }
          grep -q 'jspdf'              "$H" || { echo "::error::pdf engine reference missing"; exit 1; }
          # No leaked personal data from the reference app, ever.
          if grep -qiE 'nhof studio|jay williams|only1just|ttgcrew|951-473|510-559' "$H"; then
            echo "::error::personal data found in the shipped bundle"; exit 1
          fi
          echo "bundle checks passed"

      - name: Install Tauri CLI
        shell: bash
        # Cached in ~/.cargo/bin — compiling it from source costs ~10 minutes a run.
        run: |
          if command -v cargo-tauri >/dev/null 2>&1; then
            echo "tauri-cli already present: $(cargo tauri --version)"
          else
            cargo install tauri-cli --version "^2" --locked
          fi

      - name: Build the installer
        shell: bash
        working-directory: avy
        run: |
          # The cargo cache restores previous runs' bundles. Left in place they get
          # collected alongside the new one and the wrong binary gets tested.
          rm -rf src-tauri/target/release/bundle
          cargo tauri build --config src-tauri/tauri.conf.json --bundles nsis

      - name: Collect artefacts
        shell: bash
        working-directory: avy
        run: |
          V="${{ inputs.version || '1.0.0' }}"
          rm -rf out && mkdir -p out
          find src-tauri/target/release/bundle -type f -iname "*${V}*setup.exe" -exec cp {} out/ \;
          ls -la out
          N=$(ls -1 out/*setup.exe 2>/dev/null | wc -l | tr -d ' ')
          if [ "$N" != "1" ]; then
            echo "::error::expected exactly 1 installer for version $V, found $N"
            ls -la src-tauri/target/release/bundle/nsis 2>/dev/null || true
            exit 1
          fi
          echo "collected: $(ls out)"

      - name: Verify the installer is real
        shell: pwsh
        working-directory: avy
        run: |
          # An installer that exists but is a few KB is the zero-byte-app failure again.
          Get-ChildItem out | ForEach-Object {
            $kb = [math]::Round($_.Length / 1KB)
            Write-Host "$($_.Name) = $kb KB"
            if ($_.Length -lt 500KB) {
              Write-Error "::error::$($_.Name) is only $kb KB - too small to be a real installer"
              exit 1
            }
          }

      # ---- the step that actually proves it works -------------------------------
      # A file that exists is not a working installer. The plugin .pkg that shipped
      # zero-byte apps to 200-300 people built cleanly too. The runner is Windows, so
      # install it here, confirm the app landed, and launch it.
      # ---- the step that actually proves it works -------------------------------
      # A file that exists is not a working installer. The plugin .pkg that shipped
      # zero-byte apps to 200-300 people also exited 0. So: install it here, FIND where
      # it really landed (never assume a path), confirm it is not a hollow shell, and
      # launch it.
      - name: Install it, then launch it
        shell: pwsh
        working-directory: avy
        run: |
          $ErrorActionPreference = "Stop"
          $want = "${{ inputs.version || '1.0.0' }}"
          $all  = @(Get-ChildItem out -Filter *setup.exe)
          if ($all.Count -ne 1) { Write-Error "expected 1 installer, found $($all.Count)"; exit 1 }
          $setup = $all[0]
          if ($setup.Name -notlike "*$want*") {
            Write-Error "about to test $($setup.Name) but this run is for $want"
            exit 1
          }
          Write-Host "testing the $want installer: $($setup.Name)"

          Write-Host "installing $($setup.Name) silently..."
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "installer returned $($p.ExitCode)"; exit 1 }
          Start-Sleep -Seconds 3

          # Ask Windows where it went rather than guessing. An installer that exits 0 and
          # registers nothing has not installed anything.
          $paths = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty $paths -ErrorAction SilentlyContinue |
                   Where-Object { $_.DisplayName -like "*AVY*" } | Select-Object -First 1
          if ($entry) {
            Write-Host "registry: $($entry.DisplayName) $($entry.DisplayVersion) -> $($entry.InstallLocation)"
            # The installed version must match what we set out to build, or the release
            # tag is describing something other than what is inside it.
            if ($entry.DisplayVersion -and $entry.DisplayVersion -ne $want) {
              Write-Error "installed version is $($entry.DisplayVersion) but this run built $want"
              exit 1
            }
          } else {
            Write-Host "registry: no AVY uninstall entry"
          }

          $roots = @()
          if ($entry -and $entry.InstallLocation) { $roots += $entry.InstallLocation }
          $roots += @(
            "$env:LOCALAPPDATA\Programs\AVY Systems",
            "$env:LOCALAPPDATA\AVY Systems",
            "$env:ProgramFiles\AVY Systems",
            "${env:ProgramFiles(x86)}\AVY Systems",
            "$env:APPDATA\Local\AVY Systems"
          )

          $exe = $null
          foreach ($r in $roots) {
            if ($r -and (Test-Path $r)) {
              Write-Host "searching $r"
              $exe = Get-ChildItem $r -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
              if ($exe) { break }
            }
          }

          if (-not $exe) {
            Write-Host "--- wide sweep for anything named AVY ---"
            $hits = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles","${env:ProgramFiles(x86)}","$env:APPDATA" `
                      -Recurse -Depth 3 -Filter "*AVY*" -ErrorAction SilentlyContinue | Select-Object -First 25
            if ($hits) { $hits | ForEach-Object { Write-Host "  $($_.FullName)" } } else { Write-Host "  nothing found anywhere" }
            Write-Error "installer exited 0 but installed nothing findable - this is the zero-byte failure"
            exit 1
          }

          $kb = [math]::Round($exe.Length / 1KB)
          Write-Host "installed exe: $($exe.FullName) = $kb KB"
          if ($exe.Length -lt 100KB) { Write-Error "installed exe is only $kb KB - hollow shell"; exit 1 }

          Write-Host "launching..."
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) {
            Write-Error "app exited immediately with code $($app.ExitCode) - it does not run"
            exit 1
          }
          Write-Host "PROVEN: installed from the .exe and still running after 12s (pid $($app.Id))"
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: avy-systems-windows
          path: avy/out/**
          retention-days: 14

      - name: Publish for testing
        if: inputs.publish == 'yes'
        shell: bash
        working-directory: avy
        env:
          GH_TOKEN: ${{ secrets.NHOF_PAT }}
        run: |
          TAG="avy-v${{ inputs.version || '1.0.0' }}"
          gh release view "$TAG" --repo only1justjay/nhof-build-runner >/dev/null 2>&1 \
            || gh release create "$TAG" --repo only1justjay/nhof-build-runner \
                 --title "AVY Systems $TAG (Windows)" \
                 --notes "Windows installer for AVY Systems Invoice & Bookings. Installed and launched on a Windows runner before publishing."
          gh release upload "$TAG" out/*.exe --repo only1justjay/nhof-build-runner --clobber
          echo "published: https://github.com/only1justjay/nhof-build-runner/releases/tag/$TAG"
