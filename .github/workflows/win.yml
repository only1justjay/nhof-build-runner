name: win-retail
on: { workflow_dispatch: {} }
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repo: blapp,        ref: main }
          - { repo: synth,        ref: main }
          - { repo: forge,        ref: main }
          - { repo: TheMaster,    ref: main }
          - { repo: vocal-sauce,  ref: worktree-m0-skeleton }
    steps:
      - name: Checkout plugin (private, via token)
        uses: actions/checkout@v4
        with:
          repository: only1justjay/${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          token: ${{ secrets.NHOF_PAT }}
          path: plugin
      - name: Checkout nhof-licensing (private)
        uses: actions/checkout@v4
        with:
          repository: only1justjay/nhof-licensing
          ref: main
          token: ${{ secrets.NHOF_PAT }}
          path: nhof-licensing
      - name: Clone JUCE 8.0.14
        shell: bash
        run: git clone --depth 1 --branch 8.0.14 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure
        shell: bash
        run: cmake -S plugin -B plugin/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: cmake --build plugin/build --config Release --parallel
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find plugin/build -type d -path "*Release/VST3/*.vst3" | while read v; do cp -R "$v" out/; done
          find plugin/build -type f -path "*Release/Standalone/*.exe" -exec cp {} out/ \;
          find out -type f \( -iname "*.ilk" -o -iname "*.exp" -o -iname "*.lib" -o -iname "*.pdb" \) -delete || true
          ls -R out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.repo }}-win
          path: out/**
          retention-days: 1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build unsigned installer
        shell: bash
        run: |
          cd out
          curl -sL -o wizard.bmp https://raw.githubusercontent.com/only1justjay/nhof-build-runner/main/brand/wizard.bmp
          curl -sL -o wizard-small.bmp https://raw.githubusercontent.com/only1justjay/nhof-build-runner/main/brand/wizard-small.bmp
          VST3=$(find . -maxdepth 1 -type d -name "*.vst3" | head -1 | sed 's|^\./||')
          EXE=$(find . -maxdepth 1 -type f -name "*.exe" | head -1 | sed 's|^\./||')
          PROD="${VST3%.vst3}"
          [ -z "$PROD" ] && PROD="${EXE%.exe}"
          [ -z "$PROD" ] && PROD="${{ matrix.repo }}"
          echo "Product=$PROD  VST3=$VST3  EXE=$EXE"
          {
            printf '[Setup]\n'
            printf 'AppName=%s\n' "$PROD"
            printf 'AppVersion=1.0\n'
            printf 'AppPublisher=New Hall of Fame Studios\n'
            printf 'DefaultDirName={autopf}\\NHOF\\%s\n' "$PROD"
            printf 'DisableProgramGroupPage=yes\n'
            printf 'DisableDirPage=yes\n'
            printf 'ArchitecturesAllowed=x64\n'
            printf 'ArchitecturesInstallIn64BitMode=x64\n'
            printf 'PrivilegesRequired=admin\n'
            printf 'OutputDir=installer_out\n'
            printf 'OutputBaseFilename=%s Installer\n' "$PROD"
            printf 'Compression=lzma2\n'
            printf 'SolidCompression=yes\n'
            printf 'WizardStyle=modern\n\n'
            printf 'WizardImageFile=wizard.bmp\n'
            printf 'WizardSmallImageFile=wizard-small.bmp\n'
            printf '[Files]\n'
            if [ -n "$VST3" ]; then printf 'Source: "%s\\*"; DestDir: "{commoncf}\\VST3\\%s"; Flags: recursesubdirs createallsubdirs ignoreversion\n' "$VST3" "$VST3"; fi
            if [ -n "$EXE" ]; then printf 'Source: "%s"; DestDir: "{app}"; Flags: ignoreversion\n' "$EXE"; fi
            if [ -n "$EXE" ]; then
              printf '\n[Icons]\n'
              printf 'Name: "{autoprograms}\\%s"; Filename: "{app}\\%s"\n' "$PROD" "$EXE"
              printf 'Name: "{autodesktop}\\%s"; Filename: "{app}\\%s"; Tasks: desktopicon\n' "$PROD" "$EXE"
              printf '\n[Tasks]\n'
              printf 'Name: "desktopicon"; Description: "Create a desktop shortcut"; Flags: unchecked\n'
              printf '\n[Run]\n'
              printf 'Filename: "{app}\\%s"; Description: "Launch %s"; Flags: nowait postinstall skipifsilent\n' "$EXE" "$PROD"
            fi
          } > installer.iss
          echo "=== installer.iss ==="; cat installer.iss
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss
          echo "=== installer_out ==="; ls -la installer_out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.repo }}-win-installer
          path: out/installer_out/**
          retention-days: 3
      - name: Smoke-test installer on Windows (silent install + verify placement)
        shell: pwsh
        run: |
          $exe = Get-ChildItem out/installer_out -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "No installer was produced"; exit 1 }
          Write-Host "Silently installing $($exe.Name) ..."
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "Installer failed with exit code $($p.ExitCode)"; exit 1 }
          $vst3dir = Join-Path $env:CommonProgramFiles 'VST3'
          $vst3 = Get-ChildItem $vst3dir -Directory -Filter *.vst3 -ErrorAction SilentlyContinue
          if (-not $vst3) { Write-Error "FAIL: no .vst3 found in $vst3dir after install"; exit 1 }
          Write-Host "PASS: VST3 installed ->" (($vst3 | ForEach-Object { $_.Name }) -join ', ')
          Get-ChildItem $vst3dir -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 8 | ForEach-Object { Write-Host "   " $_.FullName }
